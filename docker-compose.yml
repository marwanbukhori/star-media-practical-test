services:
  app:
    build: .
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    environment:
      # Matches Railway's own MySQL plugin env var names, so src/Config.php's env-based
      # path is exercised identically here and in production — see src/Config.php.
      MYSQLHOST: db
      MYSQLPORT: 3306
      MYSQLDATABASE: smg_consent
      MYSQLUSER: root
      MYSQLPASSWORD: smg_dev_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: smg_dev_password
      MYSQL_DATABASE: smg_consent
    volumes:
      - smg_db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psmg_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smg_db_data:
